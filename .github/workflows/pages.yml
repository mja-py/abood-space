name: Deploy to GitHub Pages

# Publishes the game to the gh-pages branch on every push to main.
# GitHub serves that branch at https://<user>.github.io/<repo>/.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Stamp the commit id into the cache names and asset URLs so players always get the new version
      - name: Stamp build version
        run: |
          V="${GITHUB_SHA::8}"
          sed -i "s/__BUILD__/$V/g" index.html sw.js js/*.js
          mkdir -p _site
          cp -r index.html sw.js manifest.webmanifest .nojekyll css js assets _site/
          # a file that still says __BUILD__ would keep a stale cache name or asset URL
          if grep -rl __BUILD__ _site; then echo "Unstamped files above"; exit 1; fi
          echo "Build $V"

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          force_orphan: true
